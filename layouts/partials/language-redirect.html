{{- /*
  Override de themes/blowfish/layouts/partials/language-redirect.html (Blowfish v3.10.0), chamado pelo head.html
  do tema. Mesma configuração e o MESMO JavaScript do tema (assets/js/language-redirect.js), mas sem o <script>
  inline: a configuração vai no atributo data-config e assets/js/idioma-config.js (concatenado antes do JS do
  tema, um arquivo só, com fingerprint e SRI) a entrega ao código do tema. Assim a CSP não muda.
  O seletor de idioma do cabeçalho continua (componente do tema); a escolha feita nele fica lembrada e vence o
  idioma do navegador.

  Revisar a cada atualização do Blowfish ou do Hugo: o scripts/i18n.mjs (make check-i18n) guarda o hash deste
  partial e do JS do tema e FALHA quando o tema os muda; traga as mudanças para cá, teste e atualize os hashes
  (docs/MAINTENANCE.md, "Redirecionamento pelo idioma do navegador"). O scripts/check-home.mjs confere no build
  que não há script inline e que o data-config é válido.
*/ -}}
{{ $params := site.Params.languageRedirect | default dict }}
{{ if and ($params.enabled | default false) hugo.IsMultilingual }}
  {{ $translations := slice }}
  {{ range .AllTranslations }}
    {{ $translations = $translations | append (dict "lang" .Language.Lang "languageCode" (.Language.Locale | default "") "url" .RelPermalink) }}
  {{ end }}

  {{ $browserRedirectHomeOnly := true }}
  {{ if isset $params "browserredirecthomeonly" }}
    {{ $browserRedirectHomeOnly = $params.browserRedirectHomeOnly }}
  {{ end }}

  {{ $storedLanguageRedirect := true }}
  {{ if isset $params "storedlanguageredirect" }}
    {{ $storedLanguageRedirect = $params.storedLanguageRedirect }}
  {{ end }}

  {{ $fallbackLanguage := hugo.Sites.Default.Language.Lang }}
  {{ with $params.fallbackLanguage }}
    {{ $fallbackLanguage = . }}
  {{ end }}

  {{ $config := dict "enabled" true "storageKey" ($params.storageKey | default "blowfish_preferred_language") "fallbackLanguage" $fallbackLanguage "browserRedirectHomeOnly" $browserRedirectHomeOnly "storedLanguageRedirect" $storedLanguageRedirect "currentLanguage" .Language.Lang "currentLanguageCode" (.Language.Locale | default "") "isHome" .IsHome "translations" $translations }}
  {{ $alg := site.Params.fingerprintAlgorithm | default "sha512" }}
  {{ with resources.Get "js/language-redirect.js" }}
    {{ $js := slice (resources.Get "js/idioma-config.js") . | resources.Concat "js/idioma.js" | resources.Minify | resources.Fingerprint $alg }}
    {{- /* async (o tema usa síncrono): não bloqueia a renderização (Lighthouse: FCP 1,2 s → 1,4 s no celular com
           síncrono). O arquivo é pequeno e com cache longo, então o redirecionamento acontece logo no início;
           document.currentScript funciona em script async. */}}
    <script async src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" data-config="{{ $config | jsonify }}"></script>
  {{ end }}
{{ end }}
