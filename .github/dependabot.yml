# Só GitHub Actions (PLAN.md 8.2 e 12.1). Tema (submódulo) e ferramentas (mise.toml): sob demanda.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
