# Versão em inglês (en-US). Sobrescreve só as chaves do i18n/en.yaml do Blowfish que o projeto muda e traz
# as chaves "blog.*" dos layouts próprios (as mesmas de i18n/pt-BR.yaml). make check-i18n confere que os
# dois arquivos têm as mesmas chaves.

# Título da seção de posts da home, igual ao botão "Most recent" (como em pt-BR).
shortcode:
  recent_articles: "Most recent"

# Nome do botão de busca com o texto visível (Lighthouse label-content-name-mismatch), como em pt-BR.
search:
  open_button_title: "Search: Ctrl K or /"

# Chaves que o tema usa e o en.yaml do Blowfish v3.10.0 não tem (aria-label vazio sem elas).
nav:
  toggle_submenu: "Open or close submenu"
term:
  no_articles: "There are no posts here yet."

global:
  language: "EN"

blog:
