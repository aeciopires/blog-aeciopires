  data: "2018-06-12T18:08:55-03:00"
  texto: "Fala Aécio, tudo certo amigo, com exceção da imagem do mysql que se você não especificar a versão 5.7, está baixando a última versão e dando alguns erros de permissão.\nO comando run da imagem ficaria:\nsudo docker run -d --name mysql-redmine \\\n -p 3306:3306 \\\n -v /opt/docker/mysql/data:/var/lib/mysql \\\n -e MYSQL_ROOT_PASSWORD=secret \\\n -e MYSQL_DATABASE=redmine \\\n mysql:5.7\n\nValeu abraço!"
