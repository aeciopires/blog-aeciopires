# Comentários do blog antigo (WordPress), somente leitura. Só nome, data e texto (PLAN.md 6.5).
- id: 52678
  nome: "Clecio Antao"
  data: "2020-09-18T17:48:17-03:00"
  texto: "Aecio, boa tarde. Eu criei o container e um volume para backups (/var/opt/gitlab/backups/) so que quando tento restaurar o backup ele da falta de espaço em disco. Como posso almentar o disco no container?\nObrigado"
- id: 52705
  parent: 52678
  nome: "Aécio Pires"
  data: "2020-09-20T14:30:04-03:00"
  texto: "Bom dia, Clécio!\n\nSe entendi bem você criou um diretório no seu Docker Host (exemplo: /opt/docker/gitlab/backup) e montou um volume no conteiner com destino ao diretório de backup da aplicação (/var/opt/gitlab/backups). Correto?\n\nSe a aplicação está reclamando de espaço em disco no diretório /var/opt/gitlab/backups, você não aumenta o tamanho do disco no conteiner. Você aumenta o tamanho do disco no  Docker Host no qual está localizado o diretório /opt/docker/gitlab/backup, entendeu?\n\nO volume é como se fosse um link que aponta para o diretório no Docker Host.\n\nAbraço."
- id: 56219
  nome: "Denis Bonate"
  data: "2022-01-13T11:57:47-03:00"
  texto: "Não consegui logar...\nPede usuário e senha, não pareceu opção de criar senha para root."
- id: 56222
  nome: "Marcelo de Almeida"
  data: "2022-03-18T10:22:31-03:00"
  texto: "para saber a senha inicial do usuário root, execute os passos abaixo no seu terminal:\ndocker exec -ti seu_nome_container_gitlab /bin/bash\ncat /etc/gitlab/initial_root_password\n\nLembrando, o usuário inicial é root, e a senha é a do resultado co comando cat acima."
