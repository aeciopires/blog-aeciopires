- id: 31197
  nome: "Eduardo"
  data: "2016-01-18T22:11:48-03:00"
  texto: "Aécio, boa noite.\n\nPrimeiro, gostaria de parabenizar por todo conteúdo!\n\nEstou precisando montar um mapa com desenho de um switch, onde as portas devem ficar verde quando up e vermelha quando down.\n\nVocê tem alguma ideia de como posso fazer isso?\n\nObrigado!"
- id: 31198
  parent: 31197
  nome: "Aécio Pires"
  data: "2016-01-18T23:37:36-03:00"
  texto: "Boa noite, Eduardo!\n\nObrigado! Que bom que você gostou e espero que o conteúdo seja útil no seu dia a dia.\n\nUma ideia para você montar este mapa é desenhar um switch e importar esta imagem no Zabbix na página Administração > Geral > opção Imagem.\n\nSe cada porta do switch tiver um IP diferente associada a cada uma, você pode fazer uns \"quadradinhos\" vermelhos e verdes para representar quando há algum problema na porta ou não. Neste caso cada porta seria cadastrado como se fosse um host diferente e teria suas próprias triggers e itens a serem coletados.\n\nÉ só uma ideia, eu não sei se é viável pois ainda não precisei fazer isso.\n\nSugiro pedir ajuda também na comunidade Zabbix-BR.\n\nZabbix-BR no Yahoo Groups: http://br.groups.yahoo.com/group/zabbix-brasil/\nHistórico de assuntos e soluções abordadas: https://br.groups.yahoo.com/neo/groups/zabbix-brasil/conversations/trending\nZabbix-BR no Facebook: https://www.facebook.com/groups/zabbixbrasil\n\nAbraço e fica com Deus."
