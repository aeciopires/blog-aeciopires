  texto: "Olá, Cristiano e Jonh!\n\nObrigado pelos elogios. Fico alegre ao saber que vocês gostaram do projeto e estão tentando utilizá-lo.\n\nGostaria muito de poder ajudá-los, mas já faz um ano que venho me dedicando ao trabalho e a outros projetos de software livre e por estes motivos parei de usar e contribuir com o Projeto TCOS. Nesse meio tempo muita coisa mudou.\n\nMas recomendo que vocês procurem ajuda na comunidade TCOS Brasil (http://groups.google.com/group/tcos_brasil), da qual faz parte o desenvolvedor Mario Izquierdo. Ele é espanhol, mas lê os post escritos em portugûes e responde em espanhol ou inglês.\n\nAté mais e continuem usando TCOS."
