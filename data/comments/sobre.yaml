- id: 31290
  parent: 31289
  nome: "Aécio Pires"
  data: "2017-04-03T14:03:45-03:00"
  texto: "Boa tarde, Wagner!\n\nSugiro você pedir ajuda na comunidade Zabbix-BR.\n\nZabbix-BR no Yahoo Groups:  http://br.groups.yahoo.com/group/zabbix-brasil/\nHistórico no Yahoo Groups: https://br.groups.yahoo.com/neo/groups/zabbix-brasil/conversations/trending\nZabbix-BR no Facebook: https://www.facebook.com/groups/zabbixbrasil\n\nLá você deve postar o problema com mais detalhes, por exemplo: um screenshot da configuração do discovery, o que você tentou fazer e se possível o arquivo de log do Zabbix Server (zabbix_server.log). Mas antes de mandar este log, edita o arquivo de configuração do Zabbix Server (zabbix_server.conf) e muda o parâmetro DebugLevel=4.\n\nCom essas informações eu ou outras pessoas poderão ajudá-lo melhor.\n\nAbraço e fica com Deus. :-)"
