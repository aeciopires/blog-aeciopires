- id: 56196
  nome: "Felipe Cardoso"
  data: "2021-11-26T16:37:37-03:00"
  texto: "Existe a possibilidade de usar o grafana em um dominio direto ? Sem o uso do :3000 ? Tipo graficos.seudominio.com.br"
- id: 56200
  parent: 56196
  nome: "Aécio Pires"
  data: "2021-11-29T09:48:29-03:00"
  texto: "Bom dia, Felipe!\n\nSim, você pode colocar na frente do Grafana o Nginx ou Apache para atuar como proxy reverso... ele receberia a requisição na porta 80 ou 443 e repassaria para o grafana na porta 3000. Para o usuário fica transparente... Ele tem a impressão que está acessando o Grafana diretamente na porta 80 ou 443, mas não está.\n\nPara fazer isso, tem vários tutoriais na Internet.\n\nhttps://www.google.com/search?q=nginx+proxy+reverse&oq=nginx+proxy+re&aqs=chrome.2.0i512l3j69i57j0i512l3j69i60.7472j0j7&sourceid=chrome&ie=UTF-8\n\nAbraço."
- id: 56247
  nome: "Marcio Knasel"
  data: "2022-09-26T17:05:36-03:00"
  texto: "Não precisa de um proxy reverso, pois o grafana server faz esse trabalho na sua própria configuração, você especifica o domínio e a url padrão, tendo domínio registrado e ja propagado para o IP do grafana e liberado as portas corretas tudo deve funcionar."
