  texto: "Lucas conseguir resolver o problema do Https? Diego não funcionou!\npodman run -d --name zabbix-web-nginx-mysql -t \\\n--restart always \\\n-v /podman/zabbix/ssl:/etc/ssl/nginx:ro \\\n-v /podman/zabbix/ssl/ssl.crt:/etc/ssl/nginx/ssl.crt \\\n-v /podman/zabbix/ssl/ssl.key:/etc/ssl/nginx/ssl.key \\\n-v /podman/zabbix/ssl/dhparam.pem:/etc/ssl/nginx/dhparam.pem \\\n-e ZBX_SERVER_HOST=\"zabbix-server-mysql\" \\\n-e DB_SERVER_HOST=\"mysql-server\" \\\n-e DB_SERVER_PORT=\"3306\" \\\n-e MYSQL_ROOT_PASSWORD=\"root_pwd\" \\\n-e MYSQL_DATABASE=\"zabbix\" \\\n-e MYSQL_USER=\"zabbix\" \\\n-e MYSQL_PASSWORD=\"zabbix_pwd\" \\\n-e PHP_TZ=\"America/Sao_Paulo\" \\\n--pod=zabbix \\\n--volumes-from zabbix-snmptraps \\\nzabbix/zabbix-web-nginx-mysql:${ZABBIX_VERSION}"
