  data: "2018-10-20T03:38:51-03:00"
  texto: "Ricardo Ferrigno, o Zabbix Proxy não roda diretamente no windows, mas você pode tentar utilizar o docher-machine e gerenciar um container no hyper-V.\n\nhttps://docs.docker.com/machine/drivers/hyper-v/#environment-variables-and-default-values"
