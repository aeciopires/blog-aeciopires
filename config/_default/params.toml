# -- Parâmetros próprios do projeto (lidos pelos partials/shortcodes do site) --

# giscus (comentários novos, PLAN.md 6.6). IDs PÚBLICOS, gerados em https://giscus.app
# depois de instalar o app giscus só neste repositório e criar a categoria "Comentários"
# (tipo Announcements). Enquanto repoId/categoryId estiverem vazios, o giscus não é exibido.
[giscus]
  repo = "aeciopires/blog-aeciopires"
  # IDs GraphQL (node_id), NÃO o id numérico da API REST nem o número da URL da categoria.
  # Como obter: docs/MAINTENANCE.md, seção 9 ("IDs do giscus").
  repoId = "R_kgDOV0zJLg"
  category = "Comentários"
  categoryId = "DIC_kwDOV0zJLs4DLj2M"

# Jotform (página Contato). ID do formulário atual, embutido por script como no WordPress.
[jotform]
  formId = "71428065206654"   # formulário atual (form.jotformz.com/jsform/<ID>)

# Cloudflare Web Analytics (beacon só em produção). Token público do site, do painel do Cloudflare.
[cloudflareAnalytics]
  token = "7a97edd0b7fa4f47b2842f25e0dce6b3"
